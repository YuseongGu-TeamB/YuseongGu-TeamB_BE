services:
  # 개발·시연용 DB (RDB + 벡터DB)
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: minwon
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d minwon"]
      interval: 2s
      timeout: 3s
      retries: 30

  # 테스트 전용 DB. tmpfs라 컨테이너를 다시 띄우면 비어 있다.
  db-test:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: minwon_test
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d minwon_test"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
